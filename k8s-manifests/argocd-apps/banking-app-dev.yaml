apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-core-service-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MiMiTheCoder39/enterprise-banking-platform
    targetRevision: main
    path: k8s-manifests/apps/banking-core-service
  destination:
    server: https://kubernetes.default.svc
    namespace: banking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true